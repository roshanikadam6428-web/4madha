
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Madha Taluka, Solapur District</title>

    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link rel="stylesheet" href="resources/photon-geocoder-autocomplete.min.css">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 750px;
            position: relative;
        }

        #map-title {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            color: #222;
            padding: 12px 20px;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
        }

        .ol-control > * {
            background-color: #f8f8f8 !important;
            color: #444 !important;
        }

        .ol-control {
            background-color: rgba(255,255,255,0.4) !important;
            padding: 2px !important;
        }
    </style>
</head>

<body>
    <div id="map-title">Madha Taluka, Solapur District</div>

    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>

    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>

    <script src="layers/madha_shp_1.js"></script>
    <script src="layers/railways_2.js"></script>
    <script src="layers/road_3.js"></script>
    <script src="layers/water_4.js"></script>
    <script src="layers/waterways_5.js"></script>

    <script src="styles/madha_shp_1_style.js"></script>
    <script src="styles/railways_2_style.js"></script>
    <script src="styles/road_3_style.js"></script>
    <script src="styles/water_4_style.js"></script>
    <script src="styles/waterways_5_style.js"></script>

    <script src="./layers/layers.js"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <script>
        // Kilometre scale bar
        if (typeof map !== 'undefined') {
            map.addControl(new ol.control.ScaleLine({
                units: 'metric',
                bar: true,
                steps: 4,
                text: true,
                minWidth: 100
            }));
        }
    </script>
</body>
</html>
