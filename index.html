
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Solapur District</title>

    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 932px;
            height: 626px;
            position: relative;
        }

        #map-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            color: #222;
            padding: 10px 25px;
            font-size: 24px;
            font-weight: bold;
            border: 1px solid #444;
            border-radius: 4px;
            white-space: nowrap;
        }

        .ol-control > * {
            background-color: #f8f8f8 !important;
            color: #444 !important;
            border-radius: 0;
        }

        .ol-attribution a,
        .gcd-gl-input::placeholder,
        .search-layer-input-search::placeholder {
            color: #444 !important;
        }

        .search-layer-input-search {
            background-color: #f8f8f8 !important;
        }

        .ol-control > *:focus,
        .ol-control > *:hover {
            background-color: rgba(248,248,248,0.7) !important;
        }

        .ol-control {
            background-color: rgba(255,255,255,0.4) !important;
            padding: 2px !important;
        }

        .ol-scale-bar,
        .ol-scale-line {
            left: 10px !important;
            bottom: 10px !important;
        }
    </style>
</head>

<body>
    <div id="map-title">Solapur District</div>

    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>

    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>

    <script src="layers/madha_shp_1.js"></script>
    <script src="layers/railways_2.js"></script>
    <script src="layers/road_3.js"></script>
    <script src="layers/water_4.js"></script>
    <script src="layers/waterways_5.js"></script>

    <script src="styles/madha_shp_1_style.js"></script>
    <script src="styles/railways_2_style.js"></script>
    <script src="styles/road_3_style.js"></script>
    <script src="styles/water_4_style.js"></script>
    <script src="styles/waterways_5_style.js"></script>

    <script src="./layers/layers.js" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <script>
        // Add scale bar after the map is created
        if (typeof map !== 'undefined' && typeof ol !== 'undefined') {
            var scaleControl = new ol.control.ScaleLine({
                units: 'metric',
                bar: true,
                steps: 4,
                text: true,
                minWidth: 100
            });

            map.addControl(scaleControl);
        }
    </script>
</body>
</html>
